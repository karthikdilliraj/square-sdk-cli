name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # The published bundle runs on plain node (engines: >=18), so smoke-test it there.
  node-smoke:
    name: Smoke test on node ${{ matrix.node }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: bun install --frozen-lockfile --production
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Help renders without auth
        run: node dist/square.js --help | grep -q "Namespaces:"
      - name: Dry run builds a request
        env:
          SQUARE_ACCESS_TOKEN: dummy
        run: |
          node dist/square.js payments create --amountMoney.amount 100 --dry-run --json-output \
            | grep -q '"amountMoney":{"amount":100}'
