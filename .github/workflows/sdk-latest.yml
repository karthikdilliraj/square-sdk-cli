name: Latest Square SDK

# Weekly check that the CLI still works with the newest `square` release.
# tests/contract.test.ts fails here first if the SDK's structure changes.
on:
  schedule:
    - cron: "0 9 * * 1" # Mondays 09:00 UTC
  workflow_dispatch:

jobs:
  test-latest-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install
      - name: Upgrade square to latest (CI only, not committed)
        run: bun add square@latest
      - run: bun pm ls | grep square
      - run: bun run typecheck
      - run: bun test
      # A newer SDK can also break only the published bundle, so build it and
      # exercise the bundle on node rather than stopping at the test suite.
      - run: bun run build
      - name: Bundle help renders
        run: node dist/square.js --help | grep -q "Namespaces:"
      - name: Bundle dry run builds a request
        env:
          SQUARE_ACCESS_TOKEN: dummy
        run: |
          node dist/square.js payments create --amountMoney.amount 100 --dry-run --json-output \
            | grep -q '"amountMoney":{"amount":100}'
      - name: Bundle reports the SDK version it runs against
        run: node dist/square.js --version